# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. The site does that today, so its "page not found" screen is
# delivered as a success: search engines index it, uptime checks call it healthy, link checkers
# pass, and a deploy that drops a route looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/app.tsx must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and a product framed by another
    # origin is a clickjacking surface for whatever that session can do.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did, stripping nosniff from every hashed
        # script in every frontend cut from this template.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        # REPEATED, because `error_page 404 /index.html` IS an internal redirect — unlike
        # `try_files`, it re-enters this block. So an honest 404, the thing this whole config
        # exists to preserve, was served with Cache-Control and NOTHING ELSE: no nosniff, no
        # frame-options, no referrer-policy. Third instance of the same nginx rule in this file —
        # add_header does not accumulate, and a location declaring any inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with the route table in src/app.tsx and NAV in src/components/shell.tsx.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` below — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `/?$` AND NOT `(/|$)`, AND THE DIFFERENCE IS THE WHOLE POINT OF THIS FILE.
    #
    # `(/|$)` is a PREFIX: it matches /settings, and it also matches /settings/anything/at/all.
    # The router does not — `<Route path="settings">` has no children, so /settings/deeper falls to
    # `path="*"` and renders NotFoundPage. Under `(/|$)` that page was served with 200. So the app
    # shipped a not-found screen delivered as a success for every address beneath every route it
    # owns: crawlers may index it, link checkers pass it, and a deploy that drops a route looks
    # exactly like a deploy that did not — which is the precise failure the header of this file
    # says the enumeration exists to prevent, reintroduced two blocks below it.
    #
    # It is not hypothetical and it is not new. `site`'s nginx.conf records the same defect found
    # the same way: `location ~ ^/(products|…)(/|$)` served 200 for /products/pay, an address old
    # links genuinely carry. It was found by probing a running image, not by reading the file.
    #
    # THIS IS A TEMPLATE, so the shape here is the shape thirteen frontends inherited. If your
    # surface has a route WITH children — `/markets/:id` — enumerate the child shape explicitly
    # rather than reaching for `(/|$)`, and make test/browser-journeys.test.ts probe both.
    location ~ ^/(settings)/?$ {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate both.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
