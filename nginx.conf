# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. Its "page not found" screen is then delivered as a success: search
# engines index it, uptime checks call it healthy, link checkers pass, and a deploy that drops a
# route looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. test/routes.test.ts
# checks that they do, in both directions — a route in React and not here 404s on a hard refresh,
# and a route here and not in React answers 200 with a not-found screen.
#
# NOTE ON THIS SURFACE SPECIFICALLY: nothing below authorises anything. `micro-lantern` is what
# refuses an unauthenticated read (`lantern/src/server.ts:623-636`), and it does so behind the same
# hostname. This block serves a static bundle to anyone who asks, which is correct — the bundle
# contains no data. A `deny` here would be a second, weaker copy of a decision the service already
# makes properly, and the copy is the one that goes stale.

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. An operator
    # pastes `/request?id=…` into chat, and the person who opens it lands on a cold page.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and a product framed by another
    # origin is a clickjacking surface for whatever that session can do. On an admin console that
    # session is an operator's.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template this was cut from,
        # stripping nosniff from every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        # REPEATED, because `error_page 404 /index.html` IS an internal redirect — unlike
        # `try_files`, it re-enters this block. So an honest 404, the thing this whole config
        # exists to preserve, was served with Cache-Control and NOTHING ELSE: no nosniff, no
        # frame-options, no referrer-policy. Third instance of the same nginx rule in this file —
        # add_header does not accumulate, and a location declaring any inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts fails if they diverge.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `/?$` AND NOT `(/|$)`, AND THE DIFFERENCE IS THE WHOLE POINT OF THIS FILE.
    #
    # `(/|$)` is a PREFIX: it matches /events, and it also matches /events/anything/at/all. The
    # router does not — `<Route path="events">` has no children, so /events/deeper falls to
    # `path="*"` and renders NotFoundPage. Under `(/|$)` that page is served with 200, so the app
    # ships a not-found screen delivered as a success for every address beneath every route it
    # owns. `micro-site` records the same defect found the same way, by probing a running image.
    #
    # This is also why the request lookup takes its id from the QUERY STRING rather than a path
    # segment: `/request?id=…` keeps one exact shape per route, while `/request/:id` would need a
    # child pattern here and is the shape that reintroduces the prefix.
    location ~ ^/(events|browser|request)/?$ {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate all four.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, robots.txt) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works, and never that micro-lantern is
    # reachable behind the same hostname. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
