# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. Its "page not found" screen is then delivered as a success: search
# engines index it, uptime checks call it healthy, link checkers pass, and a deploy that drops a
# route looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. test/routes.test.ts
# checks that they do, in both directions — a route in React and not here 404s on a hard refresh,
# and a route here and not in React answers 200 with a not-found screen.
#
# NOTE ON THIS SURFACE SPECIFICALLY: nothing below authorises anything. `micro-lantern` is what
# refuses an unauthenticated read (`lantern/src/server.ts:623-636`), and it does so behind the same
# hostname. This block serves a static bundle to anyone who asks, which is correct — the bundle
# contains no data. A `deny` here would be a second, weaker copy of a decision the service already
# makes properly, and the copy is the one that goes stale.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts:1065-1071` reserves them so that no surface may
# take one as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`lantern-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this
# surface at the two-label `lantern.testnet.<apex>` — unreachable, because Cloudflare's Universal
# SSL is a one-label wildcard and every two-label name fails the handshake at the edge).
# `surfaces.ts` keeps the old shape deliberately, so both have to match.
#
# ── AND ON THIS SURFACE THE MAP DECIDES NOTHING, WHICH IS WHY IT NEEDS A PARAGRAPH ────────────
#
# On every OTHER surface in this estate `$cf_env` is the switch between "indexable" and "not":
# `site` and `foresight-web` serve a sitemap and `Allow: /` on mainnet and refuse everything
# elsewhere. Here BOTH BRANCHES ARE THE SAME. Lantern is `adminOnly: true`
# (`ui/packages/ui/src/surfaces.ts:407`), `robotsDirective` reads that field and nothing else
# (`ui/packages/ui/src/seo.ts:139-142`), and an operator console is no more indexable on mainnet
# than on testnet — so /robots.txt answers `Disallow: /` UNCONDITIONALLY and /sitemap.xml 404s
# unconditionally, and neither block tests `$cf_env` at all.
#
# It is kept regardless, and NOT as decoration. It is the estate's shared mechanism, this file is
# the shape every surface's nginx.conf is read against, and the day this console stops being
# `adminOnly` the person who flips it must not also have to remember to invent an environment
# guard from scratch — that is precisely the sequence that leaves a testnet estate indexed. It also
# costs nothing: an unused `map` is evaluated lazily by nginx, once, only if a variable is read.
# test/sitemap.test.ts asserts the alternation still equals ENV_LABELS, so it cannot rot in place.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. An operator
    # pastes `/request?id=…` into chat, and the person who opens it lands on a cold page.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: the bar carries a session, and a product framed by another
    # origin is a clickjacking surface for whatever that session can do. On an admin console that
    # session is an operator's.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template this was cut from,
        # stripping nosniff from every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        # REPEATED, because `error_page 404 /index.html` IS an internal redirect — unlike
        # `try_files`, it re-enters this block. So an honest 404, the thing this whole config
        # exists to preserve, was served with Cache-Control and NOTHING ELSE: no nosniff, no
        # frame-options, no referrer-policy. Third instance of the same nginx rule in this file —
        # add_header does not accumulate, and a location declaring any inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts fails if they diverge.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `/?$` AND NOT `(/|$)`, AND THE DIFFERENCE IS THE WHOLE POINT OF THIS FILE.
    #
    # `(/|$)` is a PREFIX: it matches /events, and it also matches /events/anything/at/all. The
    # router does not — `<Route path="events">` has no children, so /events/deeper falls to
    # `path="*"` and renders NotFoundPage. Under `(/|$)` that page is served with 200, so the app
    # ships a not-found screen delivered as a success for every address beneath every route it
    # owns. `micro-site` records the same defect found the same way, by probing a running image.
    #
    # This is also why the request lookup takes its id from the QUERY STRING rather than a path
    # segment: `/request?id=…` keeps one exact shape per route, while `/request/:id` would need a
    # child pattern here and is the shape that reintroduces the prefix.
    location ~ ^/(events|browser|request)/?$ {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate all four.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- robots.txt, and the sitemap that deliberately does not exist ----
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # BOTH ANSWERS ARE DERIVED FROM ONE REGISTRY FIELD. NEITHER IS A DECISION TAKEN IN THIS FILE.
    #
    # `robotsDirective` (ui/packages/ui/src/seo.ts:139-142) reads `servesUi` and `adminOnly` and
    # nothing else. Lantern's row carries `servesUi: true` (surfaces.ts:405) and `adminOnly: true`
    # (surfaces.ts:407), so it resolves to `noindex, nofollow`, and everything below follows from
    # that one line rather than from anybody's opinion about operator consoles.
    #
    # seo.ts states the reasoning where it belongs — indexing this address "publishes the console's
    # address, its name and its purpose to anyone searching, which is reconnaissance handed over
    # for free", and hiding "is NOT the security boundary" because `micro-lantern` verifies the
    # role on every read. That is why this is worth doing and also why it is not urgent: nothing
    # here is load-bearing for authorisation, and a `deny` in this file would be the second, weaker
    # copy the header above already refuses to write.
    #
    # ── WHY /robots.txt AT ALL, WHEN index.html ALREADY CARRIES THE META TAG ──────────────────
    #
    # Because a meta tag is only read by something that has already FETCHED the page, and a fetch
    # is the thing being declined. A crawler asks for /robots.txt first; served a 404 it proceeds
    # as though nothing were disallowed, requests `/`, and only then reads a tag telling it not to
    # index what it has already downloaded. For a console whose addresses carry estate identifiers
    # that ordering is the whole difference. The three copies — this file, index.html's static tag
    # and `DocumentMeta`'s runtime one — exist for three readers that cannot see each other's, and
    # test/sitemap.test.ts derives all three from the same registry field.
    #
    # ── WHY `Disallow: /` IS UNCONDITIONAL HERE, UNLIKE EVERY SIBLING ─────────────────────────
    #
    # `site` and `foresight-web` write `if ($cf_env) { … }` around this, because their answer is
    # "indexable on mainnet, not elsewhere". This surface's answer does not vary: `adminOnly` is a
    # property of what the console IS, not of which estate it is deployed into, so a mainnet branch
    # saying `Allow: /` would be a bug rather than a configuration. Written flat so there is no
    # branch for somebody to later fill in with the sibling's copy.
    #
    # ── AND NO `Sitemap:` LINE ────────────────────────────────────────────────────────────────
    #
    # A `Sitemap:` line under `Disallow: /` is a contradiction: it hands a crawler the index of the
    # thing it has just been told not to fetch, and several crawlers read the sitemap anyway. There
    # is nothing to point at in any case — see the 404 below. The body is generated in the test by
    # `robotsTxt({ indexable: false })` (ui/packages/ui/src/sitemap.ts:166-176), which emits no
    # `Sitemap:` line when given no URL, and compared byte for byte with what is written here.
    location = /robots.txt {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the extension in the URI through its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type text/plain;
        # Short, and not immutable. This is the one document whose whole job is to be re-fetched
        # before anything else; an hour bounds how long a stale copy could keep inviting a crawler
        # in after this file changed its mind.
        add_header Cache-Control "public, max-age=3600" always;
        # All three restated. nginx's `add_header` is all-or-nothing per level, so this location
        # declaring any header inherits NONE from the server block — the rule the three blocks
        # above already record, and the one test/routes.test.ts checks for every location here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 'User-agent: *
Disallow: /
';
    }

    # 404, ALWAYS, AND THE BLOCK EXISTS TO MAKE THAT DELIBERATE RATHER THAN INCIDENTAL.
    #
    # Without it /sitemap.xml would 404 anyway, through `location /`'s `try_files $uri =404` — the
    # same status, arrived at by accident, and indistinguishable from a sitemap somebody meant to
    # ship and forgot to build. The next reader of a bare 404 adds one. The next reader of this
    # adds nothing, which is the point.
    #
    # THIS SURFACE IS ALSO ABSENT FROM THE ESTATE'S SITEMAP, and again not by this file's choice:
    # `SITEMAP_SURFACES` (ui/packages/ui/src/sitemap.ts:47-49) filters `adminOnly` out, so `site`
    # — the only surface that may compose sibling addresses, because it is the only one whose
    # `$host` is the apex — never lists Lantern. Both halves are asserted in test/sitemap.test.ts:
    # that this location answers 404, and that the shared filter still excludes this key.
    #
    # ── WHAT THIS BLOCK DOES AND DOES NOT CHANGE, MEASURED RATHER THAN ASSUMED ────────────────
    #
    # It changes NOTHING a client can observe, and the first draft of this comment claimed the
    # opposite: that `return 404` would produce nginx's own empty response instead of falling to
    # `error_page 404 /index.html` and serving the app shell. That is wrong, and it was driven
    # rather than argued — this config, in nginx-unprivileged 1.27, `Host: lantern.cloudsforge.online`:
    #
    #   GET /sitemap.xml       404  text/html   61 bytes, the shell
    #   GET /nope/not/a/route  404  text/html   61 bytes, the shell
    #
    # `error_page` intercepts a status from `return` exactly as it intercepts one from
    # `try_files … =404`, so this location and no location at all are byte-identical. Left in and
    # written down, because a comment that was checked and found to change nothing is worth more
    # than one that sounds right: the next reader will otherwise "fix" the interception and think
    # they have improved something.
    #
    # So the block is DOCUMENTARY, and that is its whole job. Without it, /sitemap.xml 404s by
    # accident — indistinguishable from a sitemap somebody meant to ship and forgot to build, and
    # the next reader of an accidental 404 builds one. With it there is a named decision to argue
    # with, and test/sitemap.test.ts pins the 404 so the decision cannot be reversed in silence.
    #
    # A shell under a 404 is the right body in any case: the status is the entire message, every
    # crawler discards the body of a 404, and this surface answers every other unknown address the
    # same way. Machinery to make this one 404 emptier than the rest would be a special case with
    # nothing behind it.
    location = /sitemap.xml {
        return 404;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon) is served; anything else 404s, and the error page below turns that 404
    # into the app shell WITHOUT changing the status. robots.txt is NOT among the files this could
    # serve: there is no public/robots.txt in this repository and there must not be, because the
    # exact-match location above wins over this prefix and a static file would be deployed,
    # unreachable and silently edited forever — the state `site/nginx.conf:248-251` records
    # deleting its own copy to avoid.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works, and never that micro-lantern is
    # reachable behind the same hostname. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
