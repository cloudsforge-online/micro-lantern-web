name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# Inherited from micro-web-template, with the two values in the `ci` job set for this repository.
#
# `app: lantern-web` and `deep-link-path: /browser`. The deep link is a route this app REALLY has —
# src/lib/routes.ts declares it and nginx.conf gives it a location block in the same alternation —
# because the input exists to prove that pairing: a route the app owns must survive a hard refresh,
# and a route it does not own must still 404. Naming a path that does not exist would invert the
# honest-404 rule the nginx.conf exists to hold.
#
# The two jobs below are NOT duplicates of the reusable workflow. `rules` checks properties of this
# repository's nginx.conf and entry point that no shared workflow can know about; `served-headers`
# PROBES the running image for headers the config only appears to promise. Both are stricter than
# their nearest equivalent upstream, so both stay.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
    with:
      app: lantern-web
      # `/browser` is a real route: src/lib/routes.ts declares it, src/app.tsx mounts it and
      # nginx.conf enumerates it. It is chosen over `/` deliberately — `/` would pass through
      # `location = /` and prove nothing about the alternation that carries the other three.
      deep-link-path: /browser
    secrets:
      # micro-ui is private; without a contents:read token the sibling checkout 404s, the
      # `link:../ui/packages/ui` specifier installs as a dangling symlink, and Typecheck cannot
      # resolve a single @cloudsforge/ui export.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  rules:
    # The estate rules that are cheaper to grep than to review. Each one has been broken at least
    # once by a change that looked correct in isolation.
    name: Estate rules this repository adds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # Broader than the reusable workflow's version, deliberately. That one matches
        # `import.meta.env.VITE_*`; this matches `import.meta.env` at all and bare `VITE_`, and it
        # reads index.html as well as src/. It is the same rule as
        # test/no-build-time-config.test.ts, checked again here so it fails even if somebody
        # deletes the test along with the line it forbids.
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy
        # is the one that will be wrong.
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' 'cloudsforge\.online' src; then
            echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
            exit 1
          fi
          echo "ok: no hard-coded hostname"

      - name: The SPA fallback keeps its 404
        # `try_files ... /index.html` in the catch-all location is how an app starts answering 200
        # for every address that does not exist.
        #
        # Comments are stripped before the check. nginx.conf's own header quotes the forbidden
        # directive while explaining why it is forbidden, so the unstripped grep matched the
        # documentation and this step failed on a pristine template — every frontend cut from it
        # would have started life with a red pipeline over a line of prose. A guard that fires on
        # its own rationale trains people to disable the guard.
        run: |
          sed 's/#.*//' nginx.conf > /tmp/nginx.effective
          if grep -nE 'try_files\s+\$uri\s+(\$uri/\s+)?/index\.html' /tmp/nginx.effective; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          grep -q 'error_page 404 /index.html' /tmp/nginx.effective
          echo "ok: the SPA fallback keeps its 404"

      - name: The auth callback is redeemed before the app renders
        run: |
          grep -q 'bootstrapSession' src/main.tsx
          echo "ok: the session is bootstrapped before render"

      - name: No hex literal in this surface's stylesheet
        # Lantern's registry accent is byte-identical to --cf-warn, and this surface deliberately
        # re-points its accent to the ember ramp through var() indirection
        # (ui/packages/ui/src/tokens.css:594-596). A hex literal anywhere in src/styles.css is
        # either that decision being undone by hand or the design system being forked in place.
        # test/styles.test.ts is the same rule; this is here so deleting the test does not delete
        # the rule with it.
        run: |
          if grep -nE '#[0-9a-fA-F]{3,8}\b' src/styles.css; then
            echo "::error::src/styles.css must consume var(--cf-*) tokens, never hex literals"
            exit 1
          fi
          echo "ok: no hex literals in src/styles.css"

      - name: The break-glass token never ships in the bundle
        # micro-lantern accepts a static token header before it consults identity
        # (lantern/src/server.ts:617-624). That secret is for a curl. In a JavaScript bundle it
        # would be a shared credential in every browser cache the page ever loaded into.
        #
        # Comment lines are stripped first. This repository documents the header's existence at
        # length, on purpose — the next writer needs to know why it is absent — and a guard that
        # fires on its own rationale is a guard people learn to disable. Same lesson as
        # test/harness-honesty.test.ts: check the code, not the description of it.
        run: |
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx') index.html; do
            if sed -e 's://.*::' -e '/^[[:space:]]*\*/d' -e '/^[[:space:]]*\/\*/d' \
                   -e '/^[[:space:]]*<!--/d' "$f" | grep -n 'x-lantern-token'; then
              echo "::error::$f sends the break-glass token from the browser"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "ok: no break-glass token sent from the bundle"

  served-headers:
    # PROBED, NOT READ, and this is the job that most deserves to survive the migration. Both
    # defects it guards were invisible in the config and obvious in a response: nginx's
    # `add_header` is all-or-nothing per level, so a location that sets Cache-Control silently
    # loses every inherited security header; and `try_files` is a file lookup rather than an
    # internal redirect, so serving /index.html from `location = /` never enters
    # `location = /index.html`. Reading the file suggests both are fine. Curling it does not.
    #
    # The reusable workflow's image job checks that the app answers 200, that an unknown path 404s
    # and that the deep link survives a refresh. It does not read a single header, so none of this
    # is duplicated there.
    name: The served headers are the ones the config appears to promise
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: lantern-web }
      # Temporary: the sibling the `link:` dependency and the Dockerfile's `uipkg` context resolve
      # against, until @cloudsforge/ui is published.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: lantern-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: lantern-web:headers
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe the running image
        working-directory: lantern-web
        run: |
          set -uo pipefail
          docker run -d --rm --name lw-ci -p 127.0.0.1:8099:8080 lantern-web:headers
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done

          fail=0
          check() { # url, header, expected-substring, label
            got=$(curl -sI "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true)
            case "${got:-}" in
              "") echo "::error::$4 is missing $2"; fail=1 ;;
              *"$3"*) echo "  ok   $4: $2: $got" ;;
              *) echo "::error::$4 is missing or wrong for $2 (got '${got:-nothing}', wanted '$3')"; fail=1 ;;
            esac
          }

          asset=$(curl -s http://127.0.0.1:8099/ | grep -oE '/assets/[^"]+\.js' | head -1)
          for h in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            check "http://127.0.0.1:8099/" "$h" "" "the shell"
            [ -n "$asset" ] && check "http://127.0.0.1:8099$asset" "$h" "" "a hashed asset"
          done
          check "http://127.0.0.1:8099/" Cache-Control "no-store" "the shell"
          [ -n "$asset" ] && check "http://127.0.0.1:8099$asset" Cache-Control "immutable" "a hashed asset"

          # And the honest 404 the whole config exists to preserve.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/nope/not/a/route)
          [ "$code" = "404" ] || { echo "::error::an unknown path returned $code, not 404"; fail=1; }

          docker rm -f lw-ci >/dev/null 2>&1 || true
          exit $fail
